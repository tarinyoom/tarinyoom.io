baseURL = "https://tarinyoom.io/"
locale = "en-us"
title = "tarinyoom.io"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

pagination.pagerSize = 12

[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style = "tango"
    noClasses = false

[params]
  env = "production"
  description = "A personal blog for some personal projects."
  author = "Adam Reynolds"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = false

  [params.homeInfoParams]
    Title = "Welcome!"
    Content = """
A personal blog for some personal projects. I'm interested in physical simulation, and am working on a Wasm-based fluid solver at [sph.tarinyoom.io](https://sph.tarinyoom.io).
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/tarinyoom"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/adam-reynolds-246744201"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:tarinyoom@proton.me"

  [params.assets]
    disableHLJS = true

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "/contact/"
    weight = 30
